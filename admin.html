<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — админ-панель «ДарЛес»</title>
<meta name="robots" content="noindex,nofollow">
<meta name="googlebot" content="noindex,nofollow">
<link rel="icon" href="images/site/6.jpg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
<script src="js/admin-auth.js"></script>
</head>
<body>
<script>
  function bootAdminPanel() {
    // Загружаем HTML админки и скрипты — только после успешного входа
    document.title = "Админ-панель — питомник «ДарЛес»";

    function loadScript(src) {
      return new Promise((res, rej) => {
        const s = document.createElement("script");
        s.src = src; s.onload = res; s.onerror = () => rej(new Error("Не удалось загрузить " + src));
        document.body.appendChild(s);
      });
    }

    (async () => {
      try {
        const resp = await fetch("js/_panel.inc", { cache: "no-store" });
        if (!resp.ok) throw new Error("Не удалось загрузить панель");
        document.body.innerHTML = await resp.text();
        // Скрываем служебный div пока не инициализируем
        const app = document.getElementById("admin-app");
        if (app) app.style.display = "";

        await loadScript("js/products.js");
        await loadScript("js/site.js");
        await loadScript("js/photo-editor.js");
        await loadScript("js/admin.js");
        renderHeader("admin");
        renderFooter();
        document.getElementById("btnLogout").addEventListener("click", () => {
          if (confirm("Выйти из админ-панели?")) ADMIN_AUTH.logout();
        });
      } catch (e) {
        document.body.innerHTML =
          '<div style="padding:40px;text-align:center;font-family:sans-serif;color:#b3261e">' +
          'Ошибка загрузки панели: ' + String(e.message) + '<br><br>' +
          '<a href="index.html" style="color:#3c6b4c">← На главную</a></div>';
      }
    })();
  }

  ADMIN_AUTH.requireAuth(bootAdminPanel);
</script>
</body>
</html>
