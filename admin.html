<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — админ-панель «ДарЛес»</title>
<meta name="robots" content="noindex,nofollow">
<meta name="googlebot" content="noindex,nofollow">
<!-- АНТИКЭШ: браузер и CDN должны каждый раз проверять новую версию -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" href="images/site/6.jpg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=6">
<link rel="stylesheet" href="css/admin.css?v=6">
<script>
  // СРАЗУ до загрузки любых скриптов: если старая сессия не от этой версии — сбрасываем
  try {
    const s = JSON.parse(sessionStorage.getItem("darles_admin_session") || "null");
    if (s && s.v !== 5) {
      sessionStorage.removeItem("darles_admin_session");
      localStorage.removeItem("darles_admin_attempts");
    }
  } catch(e) {}
</script>
<script src="js/admin-auth.js?v=6"></script>
</head>
<body>
<script>
  function bootAdminPanel() {
    document.title = "Админ-панель — питомник «ДарЛес»";

    function loadScript(src) {
      return new Promise((res, rej) => {
        const s = document.createElement("script");
        s.src = src + "?v=6"; s.onload = res; s.onerror = () => rej(new Error("Не удалось загрузить " + src));
        document.body.appendChild(s);
      });
    }

    (async () => {
      try {
        // v4: файл переименован из js/_panel.inc — Jekyll (GitHub Pages)
        // не публикует файлы с именем, начинающимся с "_", и отдавал 404.
        const resp = await fetch("js/panel.inc?v=6", { cache: "no-store" });
        if (!resp.ok) throw new Error("Не удалось загрузить панель");
        document.body.innerHTML = await resp.text();

        await loadScript("js/products.js");
        await loadScript("js/site.js");
        await loadScript("js/photo-editor.js");
        await loadScript("js/admin-ai.js");
        await loadScript("js/plant-id.js");
        await loadScript("js/admin.js");
        renderHeader("admin");
        renderFooter();
        document.getElementById("btnLogout").addEventListener("click", () => {
          if (confirm("Выйти из админ-панели?")) ADMIN_AUTH.logout();
        });
      } catch (e) {
        document.body.innerHTML =
          '<div style="padding:40px;text-align:center;font-family:sans-serif;color:#b3261e">' +
          'Ошибка загрузки панели: ' + String(e.message) + '<br><br>' +
          '<a href="index.html" style="color:#3c6b4c">← На главную</a></div>';
      }
    })();
  }

  ADMIN_AUTH.requireAuth(bootAdminPanel);
</script>
</body>
</html>
